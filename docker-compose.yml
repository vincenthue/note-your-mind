services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: note-your-mind-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend/notes.db:/app/notes.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: note-your-mind-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
